name: 호수 프로젝트 자동 배포

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 서버에 접속해서 배포 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            echo "==== 1. 백엔드 배포 시작 ===="
            cd ~/HoSu_Project/HoSu
            
            # 깃허브에 있는 최신 코드로 강제 동기화
            git fetch --all
            git reset --hard origin/main
            
            
            # 실행 권한 주고 빌드하기
            chmod +x mvnw
            ./mvnw clean package -DskipTests
            
            # 기존에 켜져 있던 8080 서버 끄기
            fuser -k -n tcp 8080 || true
            
            # 환경 변수 설정하고 새 서버 실행 (로그 남기면서 백그라운드 실행)
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export KAKAO_KEY="${{ secrets.KAKAO_KEY }}"
            nohup java -jar target/*.jar > app.log 2>&1 &
            
            echo "==== 2. 프론트엔드 배포 시작 ===="
            cd ~/Hosu_Front/Hosu_Frontend
            
            git fetch --all
            git reset --hard origin/main
            
            npm install
            npm run build
            
            # 🔥 [추가된 부분] 빌드한 파일을 Caddy가 보는 폴더로 복사하기
            echo "파일을 /var/www/html 로 복사합니다..."
            sudo cp -r dist/* /var/www/html/
            
            echo "==== 🎉 모든 배포 완료! ===="