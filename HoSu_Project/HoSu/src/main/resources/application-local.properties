# 로컬 개발 환경 설정 (SSH 터널 사용)
# 사용 방법: -Dspring.profiles.active=local

# 데이터베이스 설정 (SSH 터널을 통한 EC2 MySQL 연결)
# SSH 터널: ssh -i "키파일.pem" -L 3307:localhost:3306 ec2-user@EC2_IP -N
spring.datasource.url=jdbc:mysql://localhost:3307/hosu_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ssafy
spring.datasource.password=${DB_PASSWORD}

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# 카카오 API 설정
kakao.api.key=${KAKAO_KEY}

# AWS S3 설정
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.bucket=${AWS_BUCKET_NAME}

# 개발 모드 로깅
logging.level.com.ssafy=DEBUG
logging.level.org.springframework.web=DEBUG
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
