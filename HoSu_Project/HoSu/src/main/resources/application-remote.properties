# EC2 원격 데이터베이스 연동 설정
spring.application.name=HoSu

# 데이터베이스 설정 (EC2 MySQL via SSH Tunnel)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/hosu_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ssafy
spring.datasource.password=${DB_PASSWORD}

# MyBatis 설정
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ssafy.**.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 개발 모드 설정 - SQL 로깅
logging.level.com.ssafy=DEBUG
logging.level.org.springframework.web=DEBUG
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# 카카오 API 설정
kakao.api.key=${KAKAO_KEY}
kakao.api.url=https://dapi.kakao.com/v2/local/search/keyword.json

# Swagger 설정
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
