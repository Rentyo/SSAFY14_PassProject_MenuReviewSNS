spring.application.name=HoSu
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/hosu_db?serverTimezone=UTC&characterEncoding=UTF-8

#현재 로컬 사용을 위한 공통Mysql로컬 ID, PW입니다.
spring.datasource.username=ssafy
spring.datasource.password=${DB_PASSWORD:}


# MyBatis 설정


#아래 코드는 mapper.xml의 경로를 명세합니다.
#
mybatis.mapper-locations=classpath:mapper/*.xml

#
#아래 코드는 VO 파일 경로를 명세합니다.
#
mybatis.type-aliases-package=com.ssafy.**.dto

#
#아래 코드는 카멜 케이스로 자동 변경해주는 기능입니다.
#
mybatis.configuration.map-underscore-to-camel-case=true

# 카카오 API 키 (GitHub Secrets에서 주입됨)
kakao.api.key=${KAKAO_KEY:}

#Swagger관련
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# SSAFY GMS OpenAI API
openai.api.key=${GMS_KEY:}

# 카카오 지도 API 설정
# 카카오 지도 검색 API URL (식당 검색에 사용)
kakao.api.url=https://dapi.kakao.com/v2/local/search/keyword.json
spring.config.import=optional:classpath:application-API-KEY.properties
# kakao.api.key는 application-API-KEY.properties 파일에서 관리됩니다

# AWS S3 설정
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.bucket=${AWS_BUCKET_NAME}

# File Upload Size Limit (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#ssafy에서 관리하는 key입니다.
gms.key=${ssafyGmsKey}
